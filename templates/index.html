<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenAI Creator - AI Content Generation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .result-area {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            min-height: 200px;
            max-height: 500px;
            overflow-y: auto;
        }

        .result-area.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-style: italic;
        }

        .result-image {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .result-text {
            white-space: pre-wrap;
            line-height: 1.6;
            color: #333;
        }

        .result-code {
            background: #282c34;
            color: #abb2bf;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            overflow-x: auto;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .history-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            grid-column: 1 / -1;
        }

        .history-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .history-item h3 {
            color: #667eea;
            font-size: 0.9em;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .history-item p {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .history-item small {
            color: #999;
            font-size: 0.8em;
        }

        .error {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #c00;
        }

        .success {
            background: #efe;
            color: #060;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #060;
        }

        .download-btn {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 14px;
        }

        .download-btn:hover {
            background: #5568d3;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>🎨 GenAI Creator</h1>
            <p class="subtitle">Generate Art, Music, Code, and Content with AI</p>
        </header>

        <div class="main-content">
            <!-- Input Section -->
            <div class="card">
                <h2>Create Something Amazing</h2>

                <div class="form-group">
                    <label for="prompt">Your Prompt</label>
                    <textarea id="prompt"
                        placeholder="Describe what you want to create... (e.g., 'A futuristic cityscape at sunset' or 'Write a Python function to sort a list')"></textarea>
                </div>

                <div class="form-group">
                    <label for="contentType">Content Type</label>
                    <select id="contentType">
                        <option value="art">🎨 Art / Image</option>
                        <option value="music">🎵 Music / Audio</option>
                        <option value="code">💻 Code</option>
                        <option value="content">📝 Text Content</option>
                    </select>
                </div>

                <button class="btn" id="generateBtn" onclick="generateContent()">
                    Generate
                </button>
            </div>

            <!-- Result Section -->
            <div class="card">
                <h2>Generated Result</h2>
                <div id="resultArea" class="result-area empty">
                    Your generated content will appear here...
                </div>
            </div>
        </div>

        <!-- History Section -->
        <div class="history-card">
            <h2>Recent Generations</h2>
            <button class="btn" onclick="loadHistory()" style="width: auto; padding: 10px 20px; margin-bottom: 20px;">
                Refresh History
            </button>
            <div id="historyArea">
                <p style="color: #999; font-style: italic;">Click "Refresh History" to load your past generations...</p>
            </div>
        </div>
    </div>

    <script>
        // Generate Content Function
        async function generateContent() {
            const prompt = document.getElementById('prompt').value.trim();
            const contentType = document.getElementById('contentType').value;
            const resultArea = document.getElementById('resultArea');
            const generateBtn = document.getElementById('generateBtn');

            // Validation
            if (!prompt) {
                resultArea.innerHTML = '<div class="error">Please enter a prompt!</div>';
                resultArea.classList.remove('empty');
                return;
            }

            // Show loading state
            generateBtn.disabled = true;
            generateBtn.textContent = 'Generating...';
            resultArea.classList.remove('empty');
            resultArea.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Creating your ${contentType}... This may take a moment.</p>
                </div>
            `;

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: prompt,
                        type: contentType
                    })
                });

                const data = await response.json();

                if (data.success) {
                    displayResult(data, contentType);
                } else {
                    resultArea.innerHTML = `<div class="error">${data.result}</div>`;
                }

            } catch (error) {
                resultArea.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = 'Generate';
            }
        }

        // Display Result Based on Type
        function displayResult(data, type) {
            const resultArea = document.getElementById('resultArea');

            if (type === 'art') {
                const imageUrl = data.local_url || data.result;
                resultArea.innerHTML = `
                    <div class="success">✓ Image generated successfully!</div>
                    <img src="${imageUrl}" alt="Generated Art" class="result-image">
                    <button class="download-btn" onclick="window.open('${imageUrl}', '_blank')">
                        Download Image
                    </button>
                `;
            } else if (type === 'code') {
                resultArea.innerHTML = `
                    <div class="success">✓ Code generated successfully!</div>
                    <div class="result-code">${escapeHtml(data.result)}</div>
                    <button class="download-btn" onclick="copyToClipboard(\`${escapeHtml(data.result).replace(/`/g, '\\`')}\`)">
                        Copy Code
                    </button>
                `;
            } else {
                resultArea.innerHTML = `
                    <div class="success">✓ Content generated successfully!</div>
                    <div class="result-text">${escapeHtml(data.result)}</div>
                    <button class="download-btn" onclick="copyToClipboard(\`${escapeHtml(data.result).replace(/`/g, '\\`')}\`)">
                        Copy Text
                    </button>
                `;
            }
        }

        // Load History Function
        async function loadHistory() {
            const historyArea = document.getElementById('historyArea');
            historyArea.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading history...</p></div>';

            try {
                const response = await fetch('/history');
                const data = await response.json();

                if (data.success && data.history.length > 0) {
                    historyArea.innerHTML = data.history.map(item => `
                        <div class="history-item">
                            <h3>${item.content_type.toUpperCase()}</h3>
                            <p><strong>Prompt:</strong> ${escapeHtml(item.prompt)}</p>
                            <small>Created: ${new Date(item.created_at).toLocaleString()}</small>
                        </div>
                    `).join('');
                } else {
                    historyArea.innerHTML = '<p style="color: #999; font-style: italic;">No generation history yet. Create something to get started!</p>';
                }

            } catch (error) {
                historyArea.innerHTML = `<div class="error">Error loading history: ${error.message}</div>`;
            }
        }

        // Utility Functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard!');
            }).catch(err => {
                alert('Failed to copy: ' + err);
            });
        }

        // Allow Enter key to submit (Ctrl+Enter)
        document.getElementById('prompt').addEventListener('keydown', function (e) {
            if (e.ctrlKey && e.key === 'Enter') {
                generateContent();
            }
        });
    </script>
</body>

</html>
